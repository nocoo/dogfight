name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.0"
      install-policy: "project"
      prepare-command: "bun run build"
      test-command: "bun run test"
      typecheck-command: "bun run typecheck"
      lint: false
      disabled-check-reasons: |-
        {
          "lint": "project has no lint script; previous CI used a no-op lint-command"
        }
    secrets: inherit
