name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@3d2e9e55fdd60aa756df454ded53ef6d06d6653f
    with:
      runtime-version: "1.4.0"
      install-policy: "project"
      prepare-command: "bun run build"
      test-command: "bun run test"
      typecheck-command: "bun run typecheck"
      lint: false
      disabled-check-reasons: '{"lint": "project has no lint script; previous CI used a no-op lint-command"}'
    secrets: inherit
