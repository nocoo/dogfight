# Dogfight CD
# - Tag push (v*.*.*) → deploy-tagged: strict version match
# - CI green on main   → deploy-main:    continuous deploy of latest main
# - workflow_dispatch  → deploy-tagged: manual redeploy of a specific tag
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  deploy-tagged:
    name: Deploy Worker (tagged)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-dogfight-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: Verify
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -fsS -o /dev/null -w "%{http_code}" https://dogfight.hexly.ai/ || echo "000")
            echo "attempt $i: http=$HTTP"
            if [ "$HTTP" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "dogfight.hexly.ai did not return 200" >&2
          exit 1

  deploy-main:
    name: Deploy Worker (main)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-dogfight-production
      cancel-in-progress: false
    steps:
      - name: Checkout main HEAD that CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: Verify
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -fsS -o /dev/null -w "%{http_code}" https://dogfight.hexly.ai/ || echo "000")
            echo "attempt $i: http=$HTTP"
            if [ "$HTTP" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "dogfight.hexly.ai did not return 200" >&2
          exit 1
